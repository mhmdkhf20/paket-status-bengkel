<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Status Pesanan Bengkel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style id="css">:root{
  --bg:#EBF0F1; --surface:#FFFFFF; --sunken:#DFE7E9; --ink:#152025; --muted:#4F6169; --line:#C4D0D4;
  --petrol:#0B5563; --on-petrol:#FFFFFF; --petrol-soft:#CFE8ED;
  --amber:#E7A11A; --amber-soft:#FBEBC5; --on-amber:#3F2A00;
  --red:#B8372A; --red-soft:#F8DAD5; --on-red:#FFFFFF;
  --green:#1F7748; --green-soft:#D2EEDD; --on-green:#FFFFFF;
  --needle:#D8432B; --focus:#0B5563; --scrim:rgba(10,18,21,.62);
  --f-head:'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --f-body:'Atkinson Hyperlegible','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1518; --surface:#162025; --sunken:#223036; --ink:#E7EFF1; --muted:#9BAEB5; --line:#2C3C43;
    --petrol:#5CBACD; --on-petrol:#03242B; --petrol-soft:#123A44;
    --amber:#F2B53D; --amber-soft:#3B2E0F; --on-amber:#2C1E00;
    --red:#FF7C6C; --red-soft:#4A211C; --on-red:#2A0A06;
    --green:#5CCB8F; --green-soft:#143726; --on-green:#062414;
    --needle:#FF6A4F; --focus:#5CBACD; --scrim:rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1518; --surface:#162025; --sunken:#223036; --ink:#E7EFF1; --muted:#9BAEB5; --line:#2C3C43;
  --petrol:#5CBACD; --on-petrol:#03242B; --petrol-soft:#123A44;
  --amber:#F2B53D; --amber-soft:#3B2E0F; --on-amber:#2C1E00;
  --red:#FF7C6C; --red-soft:#4A211C; --on-red:#2A0A06;
  --green:#5CCB8F; --green-soft:#143726; --on-green:#062414;
  --needle:#FF6A4F; --focus:#5CBACD; --scrim:rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);border-top:5px solid var(--petrol);min-height:100vh}
body.kunci{overflow:hidden}
h1,h2,h3,h4,p,ol,ul,dl,dd{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.jdl{font-family:var(--f-head);font-stretch:78%;font-weight:800;line-height:1.08;letter-spacing:.005em;overflow-wrap:anywhere}
.besar{font-size:clamp(30px,8vw,46px)}
.sedang{font-size:clamp(22px,5vw,28px)}
.muted{color:var(--muted)}
.kecil{font-size:14px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.sempit{max-width:520px}
main.wrap{padding-top:24px;padding-bottom:64px}
.sembunyi{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.galat{color:var(--red);font-weight:700;min-height:1.5em;margin:0 0 12px}
.info{color:var(--muted);margin:0 0 16px}

/* bilah atas */
.bar{background:var(--surface);border-bottom:1px solid var(--line)}
.bar-dlm{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.merek{font-size:21px;min-width:0}
.bar-kanan{display:flex;gap:0;flex:none;flex-wrap:nowrap;justify-content:flex-end}

/* tombol */
.tbl{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:2px solid var(--ink);border-radius:4px;background:transparent;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;color:var(--ink);text-align:center}
.tbl.utama{background:var(--petrol);border-color:var(--petrol);color:var(--on-petrol)}
.tbl.bahaya{border-color:var(--red);color:var(--red)}
.tbl.teks{border-color:transparent;padding:0 12px}
.tbl.kecil{min-height:36px;font-size:14px;padding:0 12px}
.tbl:disabled{opacity:.5;cursor:not-allowed}
.tautan{background:none;border:0;padding:0;color:var(--petrol);font-weight:700;text-decoration:underline;cursor:pointer;font-size:inherit}
.aksi{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* isian */
.fld{display:grid;gap:4px;margin:0 0 18px}
.fld-l{font-weight:700;font-size:15px}
.fld-h{color:var(--muted);font-size:14px}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=url],input[type=tel],select,textarea{width:100%;min-height:46px;padding:8px 12px;border:2px solid var(--line);border-radius:4px;background:var(--surface)}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{border-color:var(--petrol);outline:none;box-shadow:0 0 0 3px var(--petrol-soft)}
input[readonly]{background:var(--sunken)}
.baris-kolom{display:grid;gap:0 16px}
@media(min-width:560px){.baris-kolom{grid-template-columns:1fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:34px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:14px;cursor:pointer}
.pilih{display:flex;flex-wrap:wrap;gap:8px}
.pilih label{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:2px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer;font-weight:700}
.pilih label:has(input:checked){border-color:var(--petrol);background:var(--petrol-soft)}
.cek-daftar{display:grid;gap:4px}
.cek{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 4px}
.cek input,.pilih input{width:20px;height:20px;accent-color:var(--petrol)}
.cek small{color:var(--muted)}

/* daftar pesanan */
.ringkas{margin:4px 0 16px;color:var(--muted)}
.judul-baris{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tab{display:flex;gap:0;margin:0 0 4px;border-bottom:2px solid var(--line)}
.tab button{background:none;border:0;padding:10px 16px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px}
.tab button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--petrol)}
.grup{font-size:22px;margin:26px 0 8px;display:flex;align-items:baseline;gap:10px}
.jml{font-family:var(--f-body);font-stretch:100%;font-weight:700;font-size:15px;color:var(--muted)}
.daftar{list-style:none;padding:0;border-top:1px solid var(--line)}
.baris{display:grid;grid-template-columns:8px 1fr auto;gap:0 14px;width:100%;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:0;cursor:pointer;align-items:stretch}
.baris:hover{background:var(--petrol-soft)}
.baris .pita{background:var(--tk,var(--line))}
.baris .isi{padding:14px 0;min-width:0}
.baris .janji{padding:14px 16px 14px 0;display:flex;flex-direction:column;gap:6px;align-items:flex-end;text-align:right;white-space:nowrap}
.baris[data-t=terlambat]{--tk:var(--red)}
.baris[data-t=segera]{--tk:var(--amber)}
.baris[data-t=normal]{--tk:var(--petrol)}
.baris[data-t=siap]{--tk:var(--green)}
.baris[data-t=selesai]{--tk:var(--line)}
.nm{font-family:var(--f-head);font-stretch:78%;font-weight:800;font-size:21px;line-height:1.1;overflow-wrap:anywhere}
.mtr{font-weight:700;overflow-wrap:anywhere}
.komp{font-size:14px;overflow-wrap:anywhere}
.tgl{font-weight:700}
.tahap-b{font-size:14px}
.segmen{display:flex;gap:3px;margin:8px 0 4px;max-width:340px}
.segmen span{flex:1;height:8px;background:var(--sunken);border-radius:1px}
.segmen span.sdh{background:var(--petrol)}
.segmen span.kini{background:var(--amber)}
.cap{display:inline-block;padding:2px 8px;border-radius:3px;font-weight:700;font-size:13px;background:var(--sunken);color:var(--ink)}
.cap.terlambat{background:var(--red);color:var(--on-red)}
.cap.segera{background:var(--amber);color:var(--on-amber)}
.cap.siap{background:var(--green);color:var(--on-green)}
.kosong{padding:32px 0;display:grid;gap:12px;justify-items:start}
.spanduk{background:var(--amber-soft);color:var(--ink);border-bottom:2px solid var(--amber)}
.spanduk .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.spanduk.merah{background:var(--red-soft);border-bottom-color:var(--red)}
.spanduk-aksi{display:flex;gap:8px;flex-wrap:wrap}
.pemilik{margin-top:40px;padding-top:28px;border-top:1px solid var(--line)}
.pemilik>h2{margin-bottom:6px}
details.pulihkan{margin-top:28px;border-top:1px solid var(--line);padding-top:8px}
details.pulihkan>summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
details.pulihkan>summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
details.pulihkan[open]>summary{margin-bottom:8px}
.cadangan{margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}
.pindah{margin-top:24px;padding:16px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.pulihkan{margin-top:20px}
.pulihkan>summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.pulihkan[open]>summary{margin-bottom:8px}
.pratinjau{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-weight:700}

/* detail pesanan */
.kembali{margin:0 0 8px -12px}
.kepala-p{display:grid;gap:6px;margin-bottom:20px}
.kontak-baris{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status-kini{border:2px solid var(--ink);border-radius:6px;background:var(--surface);padding:16px;display:grid;gap:8px;margin-bottom:20px}
.bagian{margin:28px 0 0}
.bagian>h2{font-size:22px;margin-bottom:10px}
.kotak-tautan{display:grid;gap:10px}
.catatan-int{background:var(--sunken);border-radius:4px;padding:10px 12px}

/* halaman pelanggan */
.hero{display:grid;gap:20px;align-items:center;padding:8px 0 24px}
@media(min-width:640px){.hero{grid-template-columns:240px 1fr;gap:36px}}
.dial{width:min(240px,72vw);height:auto;display:block;margin:0 auto}
.d-muka{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.d-tick{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.d-tick.selesai{stroke:var(--petrol)}
.d-tick.kini{stroke:var(--needle)}
.d-jarum{transition:transform 1.3s cubic-bezier(.2,.9,.25,1);transform-origin:100px 100px}
.d-jarum line{stroke:var(--needle);stroke-width:4;stroke-linecap:round}
.d-hub{fill:var(--ink)}
.d-teks{font-family:var(--f-head);font-stretch:78%;font-weight:800;font-size:24px;fill:var(--ink);text-anchor:middle}
.d-sub{font-family:var(--f-body);font-size:10px;fill:var(--muted);text-anchor:middle}
.hero-teks{display:grid;gap:8px}
.tahap-kini{font-family:var(--f-head);font-stretch:78%;font-weight:800;font-size:clamp(22px,5.5vw,30px);line-height:1.1;color:var(--petrol)}
.rincian{display:grid;gap:0;border-top:1px solid var(--line);margin-bottom:8px}
.rincian>div{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rincian dt{color:var(--muted)}
.rincian dd{font-weight:700;overflow-wrap:anywhere}
.lini{list-style:none;padding:0;margin:8px 0 0}
.tp{position:relative;padding:0 0 26px 50px;min-height:34px}
.tp::before{content:'';position:absolute;left:15px;top:34px;bottom:2px;width:3px;background:var(--line)}
.tp:last-child::before{display:none}
.tp.selesai::before{background:var(--petrol)}
.titik{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:15px;border:3px solid var(--line);background:var(--surface);color:var(--muted)}
.tp.selesai .titik{background:var(--petrol);border-color:var(--petrol);color:var(--on-petrol)}
.tp.kini .titik{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.tp.kini.akhir .titik{background:var(--green);border-color:var(--green);color:var(--on-green)}
.tp-judul{font-size:18px;font-weight:700;line-height:1.25;padding-top:4px}
.tp.menunggu .tp-judul{color:var(--muted);font-weight:400}
.tp-ket{font-size:14px;color:var(--muted)}
.tp-desk{margin-top:6px}
.tp-cat{margin-top:6px;background:var(--sunken);border-radius:4px;padding:8px 10px}
.foto{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:10px}
.foto-b{position:relative;padding:0;border:0;background:var(--sunken);aspect-ratio:4/3;overflow:hidden;border-radius:4px;cursor:zoom-in}
.foto-b img{width:100%;height:100%;object-fit:cover;display:block}
.foto-b.rusak::after{content:'Foto tidak terbaca';position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--muted);padding:4px;text-align:center}
.foto-b .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:var(--scrim);color:#fff;font-weight:800;cursor:pointer}
.tp .tbl{margin-top:10px}
.tp .tbl.teks{margin-top:4px;margin-left:-12px;color:var(--petrol)}
.kaki{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:10px;justify-items:start}

/* lapisan */
.lapis{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media(min-width:640px){.lapis{align-items:center}}
.kotak{background:var(--surface);width:min(580px,100%);max-height:94vh;display:flex;flex-direction:column;border-radius:10px 10px 0 0;overflow:hidden}
@media(min-width:640px){.kotak{border-radius:10px}}
.kotak-kepala{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 20px 12px}
.kotak-kepala h2{font-size:26px}
.kotak-badan{overflow:auto;padding:4px 20px 8px;flex:1}
.kotak-aksi{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface)}
.lb{background:#000d;flex-direction:column;gap:12px;padding:16px;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:4px;background:#111}
.lb .kotak-aksi{padding:0;border:0;background:none}
.lb .tbl{background:var(--surface)}
.sibuk{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:80}
.sibuk-isi{background:var(--surface);padding:18px 22px;border-radius:8px;display:flex;align-items:center;gap:14px;font-weight:700}
.putar{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--petrol);border-radius:50%;animation:putar .9s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:calc(100% - 32px);text-align:center}
#toast.tampil{opacity:1;transform:translate(-50%,0)}
.meter{height:10px;background:var(--sunken);border-radius:2px;overflow:hidden;margin:8px 0 4px}
.meter span{display:block;height:100%;background:var(--petrol)}
.meter.penuh span{background:var(--red)}
ol.langkah{padding-left:22px;display:grid;gap:4px;margin:8px 0 16px}

@media (prefers-reduced-motion: reduce){
  .d-jarum{transition:none}
  #toast{transition:none}
  .putar{animation-duration:2.4s}
}
</style>
</head>

function muatGambar(file) {

    const r = new FileReader();

  const skala = Math.min(1, 900 / Math.max(bw, bh));

    field('Komponen yang dikerjakan', v.komponen, 'Ketik sendiri atau tekan pilihan di bawah.'),

/* ---------- Data pemilik: masuk, simpan, terbitkan ---------- */
async function muatAdmin() {
  const a = S.payload.adm;
  S.salt = unb64(a.salt);
  S.it = a.it || KDF_ULANG;
  const data = await decJson(S.key, a);
  S.adm = { bengkel: Object.assign({ nama: '', wa: '', tautan: '', ambang: 2 }, data.bengkel), pesanan: data.pesanan || {} };
  S.meta = {}; S.okeys = {};
  for (const id in S.adm.pesanan) {
    const o = S.payload.ord[id];
    if (!o) continue;
    try {
      const k = await kunciDariRahasia(S.adm.pesanan[id].kunci);
      S.meta[id] = await decJson(k, o.m);
      S.okeys[id] = k;
    } catch (e) { /* lewati pesanan rusak */ }
  }
  if (S.srv) srvCatat();
}
function bukaAdmin() {
  S.mode = 'admin';
  let v = null;
  try { v = JSON.parse(bacaSes('bt_view') || 'null'); } catch (e) { v = null; }
  if (v && v.nama && ['daftar', 'detail', 'pengaturan', 'pratinjau'].indexOf(v.nama) >= 0) S.view = v;
  else S.view = { nama: 'daftar', tab: 'aktif' };
  render();
}
async function masukDenganSandi(sandi, ingat) {
  S.galatMasuk = '';
  try {
    const a = S.payload.adm;
    const raw = await turunkanSandi(sandi, unb64(a.salt), a.it || KDF_ULANG);
    S.raw = raw;
    S.key = await kunciDariRaw(raw);
    if (S.srv) { await srvLogin(); await srvMuat(); }
    await muatAdmin();
    simpanSes('bt_key', b64(raw));
    if (ingat) simpanLok('bt_key', b64(raw)); else hapusLok('bt_key');
    simpanProfil(S.adm.bengkel.nama, ingat);
    bukaAdmin();
    return true;
  } catch (e) {
    S.key = null; S.raw = null; S.token = null;
    const kode = e && e.code;
    if (kode === 'terkunci' || (kode === 'ditolak' && e.data && e.data.tunggu)) S.galatMasuk ='Terlalu banyak percobaan salah. Coba lagi sekitar ' + Math.max(1, Math.ceil(((e.data && e.data.tunggu) || 900) / 60)) + ' menit lagi.';
    else if (kode === 'jaringan') S.galatMasuk = 'Tidak bisa menghubungi server. Periksa koneksi, lalu coba lagi.';
    else if (kode === 'server') S.galatMasuk = 'Server sedang bermasalah. Coba lagi sebentar lagi.';
    else if (kode === 'ditolak' && e.data && typeof e.data.sisa === 'number') S.galatMasuk = 'Kata sandi salah. Sisa percobaan sebelum dikunci sementara: ' + e.data.sisa + '.';
    return false;
  }
}
async function masukOtomatis() {
  const tersimpan = bacaSes('bt_key') || bacaLok('bt_key');
  if (!tersimpan || !S.payload.adm) return false;
  try {
    S.raw = unb64(tersimpan);
    S.key = await kunciDariRaw(S.raw);
    if (S.srv) { await srvLogin(); await srvMuat(); }
    await muatAdmin();
    if (bacaLok('bt_key')) simpanProfil(S.adm.bengkel.nama, true);
    bukaAdmin();
    return true;
  } catch (e) {
    S.key = null; S.raw = null; S.token = null;
    const kode = e && e.code;
    if (kode === 'jaringan' || kode === 'server' || kode === 'terkunci') return false; // kunci tersimpan mungkin masih benar
    hapusSes('bt_key'); hapusLok('bt_key');
    return false;
  }
}
function kunci() {
  hapusSes('bt_key'); hapusLok('bt_key'); hapusSes('bt_view');
  S.key = null; S.raw = null; S.token = null; S.adm = null; S.meta = {}; S.okeys = {}; S.fotoUrl = {}; S.fotoEnc = {};
  S.mode = 'landing';

}
async function mulaiSetup(nama, wa, sandi, ingat) {
  S.salt = crypto.getRandomValues(new Uint8Array(16));
  S.it = KDF_ULANG;
  S.raw = await turunkanSandi(sandi, S.salt, S.it);
  S.key = await kunciDariRaw(S.raw);
  S.adm = { bengkel: { nama, wa, tautan: '', ambang: 2 }, pesanan: {} };
  S.meta = {}; S.okeys = {};
  S.payload = { v: 1, pub: {}, adm: null, ord: {} };
  simpanSes('bt_key', b64(S.raw));
  if (ingat) simpanLok('bt_key', b64(S.raw));
  simpanProfil(nama, ingat);
  S.mode = 'admin';
  S.view = { nama: 'daftar', tab: 'aktif' };

async function susunPayload() {
  const P = { v: 1, t: Date.now(), pub: { nama: S.adm.bengkel.nama, wa: S.adm.bengkel.wa }, adm: null, ord: {} };
  const e = await encJson(S.key, { bengkel: S.adm.bengkel, pesanan: S.adm.pesanan });
  P.adm = { salt: b64(S.salt), it: S.it, iv: e.iv, ct: e.ct };
  for (const id in S.meta) {
    const m = S.meta[id];
    const p = {};
    if (!S.srv) { // di mode server foto disimpan terpisah di server, bukan di dalam halaman
      const lama = (S.payload.ord[id] && S.payload.ord[id].p) || {};
      for (const f of m.foto) { const x = S.fotoEnc[f.id] || lama[f.id]; if (x) p[f.id] = x; }
    }
    P.ord[id] = { m: await encJson(S.okeys[id], m), p };
  }
  return P;
}
function escJson(s) { return s.replace(/[<>&\u2028\u2029]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0')); }
function bangun(P) {
  return BAGIAN.a + document.getElementById('css').textContent + BAGIAN.b + escJson(JSON.stringify(P)) + BAGIAN.c + document.getElementById('app').textContent + BAGIAN.d;
}
/* Username = nama bengkel. Profil terakhir diingat di perangkat supaya username terisi otomatis. */
function normNama(s) { return String(s || '').normalize('NFKC').trim().replace(/\s+/g, ' ').toLowerCase(); }
function profilTersimpan() {
  try { const p = JSON.parse(bacaLok(KUNCI_PROFIL) || 'null'); return p && typeof p.nama === 'string' ? p.nama : ''; } catch (e) { return ''; }
}
function simpanProfil(nama, ingat) {
  if (ingat && nama) simpanLok(KUNCI_PROFIL, JSON.stringify({ nama })); else hapusLok(KUNCI_PROFIL);
}
function simpanLokal(P) {
  try { localStorage.setItem(KUNCI_LOKAL, JSON.stringify(P)); return true; } catch (e) { return false; }
}
function pilihPayload(berkas) {
  let lokal = null;
  try { lokal = JSON.parse(bacaLok(KUNCI_LOKAL) || 'null'); } catch (e) { lokal = null; }
  const sahih = p => !!(p && typeof p === 'object' && p.adm && p.ord && typeof p.ord === 'object');
  if (sahih(lokal) && (!sahih(berkas) || (lokal.t || 0) > (berkas.t || 0))) return lokal;
  return berkas;
}
const PESAN_GALAT = {
  tidak_ada: 'Data tidak bisa disimpan di perangkat ini. Penyimpanan peramban penuh atau diblokir (misalnya di jendela penyamaran). Hapus foto lama atau pakai peramban biasa.',
  not_writer: 'Akun ini tidak punya izin mengubah halaman. Buka dengan akun pemilik.',
  not_granted: 'Akun ini tidak punya izin mengubah halaman. Buka dengan akun pemilik.',
  too_large: 'Data terlalu besar. Hapus foto atau pesanan lama, lalu coba lagi.',
  rate_limited: 'Terlalu sering menyimpan. Tunggu sebentar lalu coba lagi.',
  jaringan: 'Tidak bisa menghubungi server. Periksa koneksi, lalu coba lagi.',
  server: 'Server sedang bermasalah. Coba lagi sebentar lagi.',
  ditolak: 'Sesi masuk berakhir. Kunci lalu masuk lagi dengan kata sandi Anda.',
  terkunci: 'Terlalu banyak percobaan salah. Tunggu beberapa menit.'
};
async function terbitkan(pesan) {
  if (S.srv) return terbitkanSrv(pesan);
  sibuk(true, 'Menyimpan… jangan tutup halaman ini.');
  let P = null;
  try {
    P = await susunPayload();
    const ns = window.claude && window.claude.use ? await window.claude.use('artifact') : null;
    if (!ns || typeof ns.publish !== 'function') throw { code: 'tidak_ada' };
    const html = bangun(P);
    if (html.length > 15800000) throw { code: 'too_large' };
    simpanSes('bt_flash', pesan || 'Tersimpan.');
    simpanSes('bt_view', JSON.stringify(S.view));
    if (S.raw) simpanSes('bt_key', b64(S.raw));
    await ns.publish(html);
    S.payload = P;
    S.kotor = false;
    S.lokal = false;
    hapusLok(KUNCI_LOKAL);
    sibuk(false);
    render();
  } catch (e) {
    const kode = e && e.code;
    sibuk(false);
    if (kode === 'conflict') {
      simpanSes('bt_flash', 'Ada perubahan yang lebih baru dari perangkat lain. Halaman dimuat ulang, silakan ulangi perubahan Anda.');
      return;
    }
    hapusSes('bt_flash');
    const tersimpan = P ? simpanLokal(P) : false;
    if (tersimpan) S.payload = P;
    if (kode === 'tidak_ada' && tersimpan) {
      S.kotor = false;
      S.lokal = true;
      render();
      toast('Tersimpan di perangkat ini.');
      return;
    }
    S.kotor = true;
    S.galatSimpan = 'Perubahan belum tersimpan. ' + (PESAN_GALAT[kode] || 'Periksa koneksi, lalu coba lagi.');
    render();
  }
}

/* ---------- Mode server (Netlify Functions + Blobs) ----------
   Dipakai otomatis bila alamat /api/state menjawab. Data tetap dienkripsi di sini sebelum dikirim,
   server hanya menyimpan data terenkripsi. Tanpa server, aplikasi berjalan seperti biasa. */
async function srvFetch(metode, jalur, badan, auth, ulang) {
  const hd = {};
  let isi;
  if (badan !== undefined) { hd['content-type'] = 'application/json'; isi = JSON.stringify(badan); }
  if (auth && S.token) hd.authorization = 'Bearer ' + S.token;
  const ctl = new AbortController();
  const tm = setTimeout(() => ctl.abort(), 30000);
  let r;
  try { r = await fetch('/api' + jalur, { method: metode, headers: hd, body: isi, cache: 'no-store', signal: ctl.signal }); }
  catch (e) { throw { code: 'jaringan' }; }
  finally { clearTimeout(tm); }
  let j = null;
  try { j = await r.json(); } catch (e) { j = null; }
  if (r.status === 401 && auth && !ulang && S.raw && j && j.galat === 'token') {
    await srvLogin(); // sesi habis: masuk ulang diam-diam memakai kunci yang ada di memori
    return srvFetch(metode, jalur, badan, auth, true);
  }
  if (!r.ok) {
    const kode = r.status === 409 ? 'conflict' : r.status === 413 ? 'too_large' : r.status === 429 ? 'terkunci' : r.status === 401 ? 'ditolak' : r.status === 404 ? 'tidak_ditemukan' : 'server';
    throw { code: kode, status: r.status, data: j };
  }
  return j;
}
async function authDariRaw(raw) {
  const k = await crypto.subtle.importKey('raw', raw, 'HKDF', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: te.encode('bengkel-auth-v1') }, k, 256);
  return b64(new Uint8Array(bits));
}
async function srvLogin() {
  const j = await srvFetch('POST', '/login', { auth: await authDariRaw(S.raw) }, false, true);
  S.token = j.token;
  S.rev = j.rev;
  return j;
}
/* null = server memang belum dipasang (jalan di mode lokal). { galat } = server ada tetapi sedang bermasalah.
   Peramban yang pernah berhasil menghubungi server tidak boleh turun diam-diam ke mode lokal, karena
   data yang diubah di sana akan terpisah dari data di server. */
async function srvState() {
  if (!/^https?:$/.test(location.protocol)) return null;
  const pernah = !!bacaLok(KUNCI_SRV);
  const ctl = new AbortController();
  const tm = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch('/api/state', { cache: 'no-store', signal: ctl.signal });
    let j = null;
    try { j = await r.json(); } catch (e) { j = null; }
    if (j && j.srv === 1) {
      simpanLok(KUNCI_SRV, '1');
      return r.ok ? j : { galat: 'server' };
    }
    if (pernah && r.status >= 500) return { galat: 'server' };
    return null;
  } catch (e) { return pernah ? { galat: 'jaringan' } : null; } finally { clearTimeout(tm); }
}
async function srvMuat() {
  const j = await srvFetch('GET', '/admin', undefined, true);
  S.rev = j.rev;
  S.payload = { v: 1, pub: j.pub || {}, adm: j.adm, ord: {} };
  const ids = j.ids || [];
  for (let i = 0; i < ids.length; i += 40) {
    const r = await srvFetch('GET', '/ord?ids=' + ids.slice(i, i + 40).join(','), undefined, true);
    Object.assign(S.payload.ord, r.ord || {});
  }
}
function srvCatat() {
  S.lastJson = {}; S.fotoSrv = {};
  for (const id in S.meta) {
    S.lastJson[id] = JSON.stringify(S.meta[id]);
    S.meta[id].foto.forEach(f => { S.fotoSrv[id + '/' + f.id] = 1; });
  }
}
async function terbitkanSrv(pesan) {
  sibuk(true, 'Menyimpan… jangan tutup halaman ini.');
  try {
    const P = await susunPayload();
    if (!S.srvAda) {
      const j = await srvFetch('POST', '/setup', { salt: b64(S.salt), it: S.it, auth: await authDariRaw(S.raw), pub: P.pub, adm: P.adm }, false, true);
      S.token = j.token; S.rev = j.rev; S.srvAda = true; S.credBaru = false;
      S.lastJson = {}; S.fotoSrv = {};
    }
    const ref = {};
    for (const id in S.meta) S.meta[id].foto.forEach(f => { ref[id + '/' + f.id] = 1; });
    const baru = Object.keys(ref).filter(k => !S.fotoSrv[k]);
    for (let i = 0; i < baru.length; i++) {
      const e = S.fotoEnc[baru[i].split('/')[1]];
      if (!e) continue;
      if (baru.length > 1) sibuk(true, 'Mengunggah foto ' + (i + 1) + ' dari ' + baru.length + '…');
      await srvFetch('PUT', '/f/' + baru[i], { iv: e.iv, ct: e.ct }, true);
      S.fotoSrv[baru[i]] = 1;
    }
    if (baru.length > 1) sibuk(true, 'Menyimpan… jangan tutup halaman ini.');
    const ubah = Object.keys(P.ord).filter(id => S.lastJson[id] !== JSON.stringify(S.meta[id]));
    const hapus = Object.keys(S.lastJson).filter(id => !S.meta[id]);
    const hapusFoto = Object.keys(S.fotoSrv).filter(k => !ref[k]);
    const potong = [];
    for (let i = 0; i < ubah.length; i += 100) potong.push(ubah.slice(i, i + 100));
    const akhir = potong.length ? potong.pop() : [];
    for (const grup of potong) { // pesanan banyak: kirim bertahap, bagian terakhir membawa data akun
      const ord = {};
      grup.forEach(id => { ord[id] = { m: P.ord[id].m }; });
      const r = await srvFetch('POST', '/save', { rev: S.rev, ord }, true);
      S.rev = r.rev;
      grup.forEach(id => { S.lastJson[id] = JSON.stringify(S.meta[id]); });
    }
    const ord = {};
    akhir.forEach(id => { ord[id] = { m: P.ord[id].m }; });
    const badan = { rev: S.rev, pub: P.pub, adm: P.adm, ord, del: hapus, delFoto: hapusFoto };
    if (S.credBaru) badan.cred = { salt: b64(S.salt), it: S.it, auth: await authDariRaw(S.raw) };
    const r = await srvFetch('POST', '/save', badan, true);
    S.rev = r.rev;
    if (r.token) S.token = r.token;
    S.credBaru = false;
    akhir.forEach(id => { S.lastJson[id] = JSON.stringify(S.meta[id]); });
    hapus.forEach(id => { delete S.lastJson[id]; });
    hapusFoto.forEach(k => { delete S.fotoSrv[k]; });
    S.payload = { v: 1, pub: P.pub, adm: P.adm, ord: {} };
    for (const id in P.ord) S.payload.ord[id] = { m: P.ord[id].m };
    S.kotor = false;
    simpanSes('bt_view', JSON.stringify(S.view));
    sibuk(false);
    render();
    toast(pesan || 'Tersimpan.');
  } catch (e) {
    sibuk(false);
    const kode = e && e.code;
    if (kode === 'conflict') {
      if (!S.srvAda) {
        simpanSes('bt_flash', 'Akun pemilik sudah dibuat di server ini. Masuk dengan kata sandi akun tersebut.');
        hapusSes('bt_key'); hapusLok('bt_key');
      } else simpanSes('bt_flash', 'Ada perubahan yang lebih baru dari perangkat lain. Halaman dimuat ulang, silakan ulangi perubahan Anda.');
      location.reload();
      return;
    }
    S.kotor = true;
    S.galatSimpan = 'Perubahan belum tersimpan. ' + (PESAN_GALAT[kode] || 'Periksa koneksi, lalu coba lagi.');
    render();
  }
}

/* ---------- Cadangan dan pemulihan ---------- */
async function kumpulkanCadangan() {
  const P = await susunPayload();
  const out = { app: 'status-bengkel', fmt: 1, v: 1, t: Date.now(), pub: P.pub, adm: P.adm, ord: {} };
  const ids = Object.keys(P.ord);
  let hilang = 0;
  for (let i = 0; i < ids.length; i++) {
    const id = ids[i], p = Object.assign({}, P.ord[id].p);
    if (i % 5 === 0) sibuk(true, 'Menyiapkan cadangan… pesanan ' + (i + 1) + ' dari ' + ids.length);
    for (const f of S.meta[id].foto) {
      if (p[f.id]) continue;
      let e = S.fotoEnc[f.id];
      if (!e && S.srv) { try { e = await srvFetch('GET', '/f/' + id + '/' + f.id); } catch (er) { e = null; } }
      if (e) p[f.id] = { iv: e.iv, ct: e.ct }; else hilang++;
    }
    out.ord[id] = { m: P.ord[id].m, p };
  }
  return { out, hilang };
}
async function unduhCadangan() {
  sibuk(true, 'Menyiapkan cadangan…');
  try {
    const r = await kumpulkanCadangan();
    const url = URL.createObjectURL(new Blob([JSON.stringify(r.out)], { type: 'application/json' }));
    const a = h('a', { href: url, download: 'cadangan-bengkel-' + iso(new Date()) + '.json' });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    simpanLok('bt_cadangan', String(Date.now()));
    toast(r.hilang ? 'Cadangan diunduh, tetapi ' + r.hilang + ' foto tidak bisa diambil, jadi belum lengkap.' : 'Cadangan diunduh. Simpan di tempat yang aman.');
    if (S.mode === 'admin') render();
  } catch (e) { toast('Cadangan gagal disiapkan. Coba lagi.'); }
  finally { sibuk(false); }
}
async function bacaBerkasCadangan(file) {
  const teks = await file.text();
  let obj;
  if (teks.trimStart().startsWith('<')) {
    const m = teks.match(/<script id="data" type="application\/json">([\s\S]*?)<\/script>/);
    if (!m) throw { code: 'format' };
    obj = JSON.parse(m[1]);
  } else obj = JSON.parse(teks);
  if (!obj || typeof obj !== 'object' || !obj.adm || typeof obj.adm.salt !== 'string' || !obj.adm.iv || !obj.adm.ct || !obj.ord || typeof obj.ord !== 'object') throw { code: 'format' };
  return obj;
}
async function pulihkan(obj, sandi, ingat, pesan) {
  const a = obj.adm;
  const it = Number.isInteger(a.it) && a.it >= 1000 && a.it <= 5000000 ? a.it : KDF_ULANG;
  let raw, key, data;
  try {
    raw = await turunkanSandi(sandi, unb64(a.salt), it);
    key = await kunciDariRaw(raw);
    data = await decJson(key, a);
  } catch (e) { throw { code: 'sandi' }; }
  if (!data || typeof data !== 'object') throw { code: 'sandi' };
  const pesanan = data.pesanan || {}, meta = {}, okeys = {}, foto = {};
  for (const id in pesanan) {
    const o = obj.ord[id];
    if (!o || !o.m) continue;
    try {
      const k = await kunciDariRahasia(pesanan[id].kunci);
      const m = await decJson(k, o.m);
      if (!Array.isArray(m.foto)) m.foto = [];
      meta[id] = m; okeys[id] = k;
      const p = o.p || {};
      m.foto.forEach(f => { if (p[f.id] && p[f.id].iv && p[f.id].ct) foto[f.id] = { iv: p[f.id].iv, ct: p[f.id].ct }; });
    } catch (e) { /* lewati pesanan rusak */ }
  }
  S.salt = unb64(a.salt); S.it = it; S.raw = raw; S.key = key;
  S.adm = { bengkel: Object.assign({ nama: '', wa: '', tautan: '', ambang: 2 }, data.bengkel), pesanan };
  S.meta = meta; S.okeys = okeys; S.fotoEnc = foto; S.fotoUrl = {};
  S.credBaru = true;
  simpanSes('bt_key', b64(raw));
  if (ingat) simpanLok('bt_key', b64(raw)); else hapusLok('bt_key');
  simpanProfil(S.adm.bengkel.nama, ingat);
  S.mode = 'admin';
  S.view = { nama: 'daftar', tab: 'aktif' };
  await terbitkan(pesan || 'Cadangan dipulihkan.');
}
/* Data dari versi sebelumnya (tanpa server) yang masih tersimpan di peramban ini. */
function dataLamaLokal() {
  try {
    const p = JSON.parse(bacaLok(KUNCI_LOKAL) || 'null');
    return p && typeof p === 'object' && p.adm && p.adm.salt && p.adm.iv && p.adm.ct && p.ord && typeof p.ord === 'object' ? p : null;
  } catch (e) { return null; }
}
function kotakPindah(obj) {
  const nama = (obj.pub && obj.pub.nama) || 'bengkel Anda';
  const sandi = h('input', { type: 'password', autocomplete: 'current-password' });
  const galat = h('p', { class: 'galat', role: 'alert' });
  const tombol = h('button', { class: 'tbl utama', type: 'button' }, 'Pindahkan ke server');
  tombol.addEventListener('click', async () => {
    galat.textContent = '';
    if (!sandi.value) { galat.textContent = 'Isi kata sandi lama Anda.'; sandi.focus(); return; }
    tombol.disabled = true;
    sibuk(true, 'Memindahkan data…');
    try {
      await pulihkan(obj, sandi.value, true, 'Data dipindahkan ke server.');
      if (S.srvAda && !S.kotor) hapusLok(KUNCI_LOKAL);
    } catch (e) {
      sibuk(false);
      galat.textContent = e && e.code === 'sandi' ? 'Kata sandi salah.' : 'Pemindahan gagal. Coba lagi.';
      tombol.disabled = false;
    }
  });
  return h('section', { class: 'pindah', 'aria-labelledby': 'judul-pindah' },
    h('h3', { id: 'judul-pindah', class: 'jdl', style: 'font-size:18px;margin:0 0 6px' }, 'Data lama ditemukan'),
    h('p', { class: 'info' }, 'Data "' + nama + '" dari versi sebelumnya masih tersimpan di perangkat ini. Pindahkan ke server supaya bisa dibuka dari perangkat lain dan pelanggan langsung melihat pembaruan. Isi kata sandi lama Anda.'),
    field('Kata sandi lama Anda', sandi), galat, tombol);
}
function kotakPulihkan(sudahMasuk) {
  const berkas = h('input', { type: 'file', accept: '.json,.html,application/json,text/html' });
  const sandi = h('input', { type: 'password', autocomplete: 'off' });
  const galat = h('p', { class: 'galat', role: 'alert' });
  const tombol = h('button', { class: 'tbl' + (sudahMasuk ? ' bahaya' : ''), type: 'button' }, 'Pulihkan data');
  const jalan = async () => {
    galat.textContent = '';
    const f = berkas.files && berkas.files[0];
    if (!f) { galat.textContent = 'Pilih file cadangan dulu.'; return; }
    if (!sandi.value) { galat.textContent = 'Isi kata sandi dari data di file itu.'; sandi.focus(); return; }
    let obj;
    try { obj = await bacaBerkasCadangan(f); } catch (e) { galat.textContent = 'File ini bukan cadangan yang dikenali. Pilih file cadangan (.json) atau file halaman lama (.html).'; return; }
    const lanjut = async () => {
      tombol.disabled = true;
      sibuk(true, 'Memulihkan data…');
      try { await pulihkan(obj, sandi.value, sudahMasuk ? !!bacaLok('bt_key') : true); }
      catch (e) {
        sibuk(false);
        galat.textContent = e && e.code === 'sandi' ? 'Kata sandi salah, atau file cadangan rusak.' : 'Pemulihan gagal. Coba lagi.';
        tombol.disabled = false;
      }
    };
    if (sudahMasuk) konfirmasi('Ganti semua data?', 'Semua pesanan dan foto yang ada sekarang akan diganti dengan isi cadangan, dan kata sandi mengikuti cadangan itu. Unduh cadangan dulu bila data sekarang masih diperlukan.', 'Ya, pulihkan', lanjut);
    else await lanjut();
  };
  tombol.addEventListener('click', jalan);
  return h('div', null,
    h('p', { class: 'info' }, 'Pilih file cadangan (.json) atau file halaman lama (.html), lalu isi kata sandi dari data itu. Akun, pesanan, dan foto akan dikembalikan.'),
    field('File cadangan', berkas),
    field('Kata sandi dari data di file itu', sandi),
    galat, tombol);
}
function bagianCadangan() {
  const t = Number(bacaLok('bt_cadangan') || 0);
  return h('section', { class: 'cadangan', 'aria-labelledby': 'judul-cadangan' },
    h('h2', { id: 'judul-cadangan', class: 'jdl', style: 'font-size:22px;margin:0 0 8px' }, 'Cadangan data'),
    h('p', { class: 'info' }, 'Unduh salinan semua pesanan dan foto untuk disimpan di tempat aman, misalnya Google Drive. Isinya tetap terenkripsi, dan untuk membukanya nanti Anda perlu kata sandi Anda saat ini.'),
    h('div', { class: 'aksi', style: 'margin-top:0' }, h('button', { class: 'tbl', type: 'button', onclick: unduhCadangan }, 'Unduh cadangan')),
    h('p', { class: 'kecil muted', style: 'margin-top:8px' }, t ? 'Terakhir diunduh: ' + fmtWaktu(t) + '.' : 'Cadangan belum pernah diunduh dari perangkat ini.'),
    h('details', { class: 'pulihkan' }, h('summary', null, 'Pulihkan dari cadangan'), kotakPulihkan(true)));
}

/* ---------- Aksi data ---------- */
async function buatPesanan(f) {
  let id;
  do { id = acak(4); } while (S.meta[id] || (S.payload.ord && S.payload.ord[id]));
  const rahasia = acak(16), now = new Date().toISOString(), L = urutTahap(f.tahap);
  S.meta[id] = {
    id, nama: f.nama, kendaraan: { merek: f.merek, model: f.model }, komponen: f.komponen, targetCc: f.targetCc, janji: f.janji,
    tahap: L.map(t => t.k), aktif: L[0].k, riwayat: { [L[0].k]: { waktu: now, catatan: '' } }, foto: [], dibuat: now, diperbarui: now
  };
  S.adm.pesanan[id] = { kunci: rahasia, kontak: f.kontak, catatan: f.catatan };
  S.okeys[id] = await kunciDariRahasia(rahasia);
  S.view = { nama: 'detail', id, tab: 'aktif' };
  await terbitkan('Pesanan disimpan.');
}
async function ubahPesanan(id, f) {
  const m = S.meta[id];
  m.nama = f.nama; m.kendaraan = { merek: f.merek, model: f.model }; m.komponen = f.komponen; m.targetCc = f.targetCc; m.janji = f.janji;
  m.tahap = urutTahap(f.tahap).map(t => t.k);
  if (m.tahap.indexOf(m.aktif) < 0) m.aktif = m.tahap[0];
  m.diperbarui = new Date().toISOString();
  S.adm.pesanan[id].kontak = f.kontak;
  S.adm.pesanan[id].catatan = f.catatan;
  await terbitkan('Perubahan disimpan.');
}
async function simpanProgres(id, tahapBaru, catatan, foto, fotoSaja) {
  const m = S.meta[id], L = daftar(m), now = new Date().toISOString();
  if (!fotoSaja) {
    const iBaru = L.findIndex(t => t.k === tahapBaru), iLama = idx(m), cat = catatan.trim();
    if (iBaru !== iLama) {
      if (iBaru < iLama) L.slice(iBaru + 1).forEach(t => { delete m.riwayat[t.k]; });
      m.aktif = tahapBaru;
      m.riwayat[tahapBaru] = { waktu: now, catatan: cat };
    } else if (cat) {
      const r = m.riwayat[tahapBaru];
      m.riwayat[tahapBaru] = { waktu: (r && r.waktu) || now, catatan: cat };
    }
  }
  foto.forEach(p => m.foto.push({ id: p, tahap: tahapBaru, waktu: now }));
  m.diperbarui = now;
  await terbitkan('Progres disimpan.');
}
async function hapusFoto(id, pid) {
  const m = S.meta[id];
  m.foto = m.foto.filter(f => f.id !== pid);
  delete S.fotoEnc[pid]; delete S.fotoUrl[pid];
  await terbitkan('Foto dihapus.');
}
async function hapusPesanan(id) {
  const foto = (S.meta[id] && S.meta[id].foto) || [];
  foto.forEach(f => { delete S.fotoEnc[f.id]; delete S.fotoUrl[f.id]; });
  delete S.meta[id]; delete S.adm.pesanan[id]; delete S.okeys[id];
  S.view = { nama: 'daftar', tab: 'aktif' };
  await terbitkan('Pesanan dihapus.');
}
async function simpanPengaturan(f) {
  S.adm.bengkel = { nama: f.nama, wa: f.wa, tautan: f.tautan, ambang: f.ambang };
  if (profilTersimpan()) simpanProfil(f.nama, true);
  if (f.sandi) {
    S.salt = crypto.getRandomValues(new Uint8Array(16));
    S.raw = await turunkanSandi(f.sandi, S.salt, S.it);
    S.key = await kunciDariRaw(S.raw);
    S.credBaru = true;
    simpanSes('bt_key', b64(S.raw));
    if (bacaLok('bt_key')) simpanLok('bt_key', b64(S.raw));
  }
  S.view = { nama: 'daftar', tab: 'aktif' };
  await terbitkan('Pengaturan disimpan.');
}

/* ---------- Mulai ---------- */
async function init() {
  try { S.payload = JSON.parse(document.getElementById('data').textContent); } catch (e) { S.payload = { v: 1 }; }
  if (!S.payload || typeof S.payload !== 'object') S.payload = { v: 1 };
  S.payload.ord = S.payload.ord || {};
  const flash = bacaSes('bt_flash');
  if (flash) { hapusSes('bt_flash'); setTimeout(() => toast(flash), 400); }
  if (!(window.crypto && window.crypto.subtle)) {
    $('#root').append(h('main', { class: 'wrap sempit' }, h('p', { class: 'galat' }, 'Peramban ini tidak mendukung enkripsi yang dibutuhkan. Buka lewat peramban terbaru dan pastikan alamat diawali https.')));
    return;
  }
  const st = await srvState();
  if (st && st.galat) {
    $('#root').append(h('main', { class: 'wrap sempit' },
      h('p', { class: 'galat' }, 'Server penyimpanan sedang bermasalah. Muat ulang halaman ini sebentar lagi.'),
      h('button', { class: 'tbl', type: 'button', onclick: () => location.reload() }, 'Muat ulang')));
    return;
  }
  if (st) {
    S.srv = true;
    S.srvAda = !!st.ada;
    S.payload = { v: 1, pub: st.pub || {}, adm: st.ada ? { salt: st.salt, it: st.it, iv: '', ct: '' } : null, ord: {} };
  } else {
    const dipilih = pilihPayload(S.payload);
    if (dipilih !== S.payload) { S.payload = dipilih; S.lokal = true; }
  }
  const kode = kodeDariUrl();
  if (kode) {
    if (await bukaPublik(kode)) return;
    S.galatKode = S.galatNet || 'Kode pada tautan ini tidak ditemukan. Periksa lagi, atau hubungi bengkel.';
  } else if (await masukOtomatis()) return;
  S.mode = 'landing';
  render();
}
init().catch(e => {
  console.error(e);
  $('#root').replaceChildren(h('main', { class: 'wrap sempit' }, h('p', { class: 'galat' }, 'Terjadi kesalahan saat membuka halaman. Muat ulang halaman ini.')));
});
